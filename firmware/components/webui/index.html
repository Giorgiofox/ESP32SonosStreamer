<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPStreamer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:#0f1115; color:#e6e8ec; }
  header { padding:18px 20px; border-bottom:1px solid #232733; display:flex; align-items:baseline; gap:12px; }
  header h1 { margin:0; font-size:18px; letter-spacing:.5px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#555; display:inline-block; }
  header .dot.on { background:#38d39f; box-shadow:0 0 8px #38d39f; }
  main { max-width:820px; margin:0 auto; padding:20px; display:grid; gap:18px; }
  .card { background:#171a21; border:1px solid #232733; border-radius:12px; padding:16px 18px; }
  .card h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:#8b93a7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .stat .k { color:#8b93a7; font-size:12px; }
  .stat .v { font-size:20px; font-weight:600; }
  .zones { display:grid; gap:8px; }
  .zone { display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
          border:1px solid #2a2f3d; border-radius:9px; cursor:pointer; background:#12151b; }
  .zone:hover { border-color:#3a86ff; }
  .zone.active { border-color:#38d39f; background:#12211b; }
  .zone .ip { color:#8b93a7; font-size:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; color:#e6e8ec; background:#232733; border:1px solid #333a49;
           border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:#3a86ff; }
  button.sel { background:#1d3a5f; border-color:#3a86ff; }
  input[type=range] { flex:1; }
  .muted { color:#8b93a7; font-size:12px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>LPStreamer</h1>
  <span class="muted" id="sub">connecting...</span>
</header>
<main>
  <div class="card">
    <h2>Status</h2>
    <div class="grid">
      <div class="stat"><div class="k">Target zone</div><div class="v" id="zone">-</div></div>
      <div class="stat"><div class="k">Streaming</div><div class="v" id="streaming">-</div></div>
      <div class="stat"><div class="k">Throughput</div><div class="v" id="kbps">-</div></div>
      <div class="stat"><div class="k">Sent</div><div class="v" id="sent">-</div></div>
      <div class="stat"><div class="k">Max block</div><div class="v" id="batch">-</div></div>
      <div class="stat"><div class="k">WiFi RSSI</div><div class="v" id="rssi">-</div></div>
      <div class="stat"><div class="k">Format</div><div class="v" id="fmt">-</div></div>
      <div class="stat"><div class="k">Buffer</div><div class="v" id="buf">-</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Zones</h2>
    <div class="zones" id="zones"></div>
    <div class="row" style="margin-top:12px">
      <button onclick="rescan()">Rescan</button>
      <button onclick="disconnect()">Disconnect</button>
      <span class="muted" id="zcount"></span>
    </div>
  </div>

  <div class="card">
    <h2>Volume</h2>
    <div class="row">
      <input type="range" id="vol" min="0" max="100" value="25" onchange="setVol(this.value)">
      <span id="volv">25</span>
    </div>
  </div>

  <div class="card">
    <h2>Test source</h2>
    <div class="row">
      <button id="src-silence" onclick="setSrc('silence')">Silence</button>
      <button id="src-pink" onclick="setSrc('pink')">Pink noise</button>
    </div>
    <div class="muted" style="margin-top:8px">Pink noise = audible stability test. Becomes turntable audio once the ADC is wired.</div>
  </div>
</main>

<script>
function fmtBytes(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
async function poll(){
  try {
    const s = await (await fetch('/api/status')).json();
    document.getElementById('dot').className = 'dot' + (s.streaming?' on':'');
    document.getElementById('sub').textContent = s.ip;
    document.getElementById('zone').textContent = s.zone||'none';
    document.getElementById('streaming').textContent = s.streaming? (s.client||'yes') : 'idle';
    document.getElementById('kbps').textContent = s.kbps.toFixed(0)+' kB/s';
    document.getElementById('sent').textContent = fmtBytes(s.sent);
    document.getElementById('batch').textContent = (s.batch_us/1000).toFixed(0)+' ms';
    const rssiEl = document.getElementById('rssi');
    rssiEl.textContent = s.rssi+' dBm';
    // green = good, amber = ok/reduced margin, red = weak (risk of dropouts)
    rssiEl.style.color = s.rssi>=-67 ? '#38d39f' : (s.rssi>=-78 ? '#e5a23a' : '#e5484d');
    document.getElementById('fmt').textContent = (s.rate/1000).toFixed(1)+' kHz / '+s.bits+'-bit / '+s.ch+'ch';
    // Buffer = seconds of audio buffered ahead of realtime (Sonos + in-flight).
    const buf = document.getElementById('buf');
    if (s.streaming){ buf.textContent = s.buffer_s.toFixed(1)+' s'; buf.style.color = s.buffer_s>=1?'#38d39f':'#e5a23a'; }
    else { buf.textContent='-'; buf.style.color=''; }
    document.getElementById('src-silence').className = s.source==='silence'?'sel':'';
    document.getElementById('src-pink').className = s.source==='pink'?'sel':'';
  } catch(e){}
}
async function loadZones(){
  const z = await (await fetch('/api/zones')).json();
  const box = document.getElementById('zones'); box.innerHTML='';
  document.getElementById('zcount').textContent = z.zones.length+' zones';
  z.zones.forEach((zone,i)=>{
    const d=document.createElement('div');
    d.className='zone'+(i===z.active?' active':'');
    d.innerHTML='<span>'+zone.name+'</span><span class="ip">'+zone.ip+'</span>';
    d.onclick=()=>select(i);
    box.appendChild(d);
  });
}
async function select(i){ await fetch('/api/select?i='+i,{method:'POST'}); loadZones(); }
async function setVol(v){ document.getElementById('volv').textContent=v; await fetch('/api/volume?v='+v,{method:'POST'}); }
async function setSrc(s){ await fetch('/api/source?s='+s,{method:'POST'}); poll(); }
async function disconnect(){ await fetch('/api/disconnect',{method:'POST'}); loadZones(); poll(); }
async function rescan(){ document.getElementById('zcount').textContent='scanning...'; await fetch('/api/rescan',{method:'POST'}); loadZones(); }
loadZones(); poll(); setInterval(poll,1000);
</script>
</body>
</html>
